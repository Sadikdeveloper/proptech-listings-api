services:
  postgres:
    image: postgres:16-alpine
    container_name: proptech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proptech
    ports:
      - '5432:5432'
    volumes:
      - proptech-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d proptech']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proptech-pgdata:
